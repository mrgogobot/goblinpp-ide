[package]
name = "goblin-ide"
version = "0.1.0"
description = "Goblin++ IDE — a JetBrains-style IDE for the Goblin++ scientific language"
authors = ["Goblin++ IDE contributors"]
edition = "2021"

[lib]
name = "goblin_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
tauri-plugin-dialog = "2"
base64 = "0.22"
